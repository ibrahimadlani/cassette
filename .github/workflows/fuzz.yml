name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC, an hour nobody else picked.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "How many seeds to explore"
        default: "20000"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: 2000 seeds
    # A violation already recorded in regressions.txt is reported and
    # tolerated. The job only goes red on something nobody has written down.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Explore
        run: |
          cassette fuzz \
            --seeds ${{ github.event.inputs.seeds || 2000 }} \
            --workers 4 \
            --all \
            --no-record

  nightly:
    name: 100000 seeds
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Explore
        id: explore
        continue-on-error: true
        run: |
          cassette fuzz --seeds 100000 --workers 4 --all --no-record \
            | tee fuzz.log

      - name: Open an issue for anything new
        if: steps.explore.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The nightly run found a violation that is not in the corpus."
            echo
            echo '```'
            grep -E "^NEW" fuzz.log || tail -40 fuzz.log
            echo '```'
            echo
            echo "Reproduce with \`cassette run --seed <seed>\`, reduce with"
            echo "\`cassette shrink --seed <seed>\`."
          } > body.md
          gh issue create \
            --title "Nightly fuzz found a new violation ($(date -u +%Y-%m-%d))" \
            --body-file body.md \
            --label bug

      - name: Fail the job if anything was found
        if: steps.explore.outcome == 'failure'
        run: exit 1
