name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  hashseed:
    name: randomised PYTHONHASHSEED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Nothing in a trace may depend on the per-process hash salt. Running the
      # suite under an unpredictable seed is the cheapest way to find out.
      - name: Test under an unpredictable hash salt
        run: |
          SEED=$(python -c "import secrets; print(secrets.randbelow(4294967295))")
          echo "PYTHONHASHSEED=$SEED"
          PYTHONHASHSEED=$SEED pytest -q
