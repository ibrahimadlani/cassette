[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cassette"
version = "0.1.0"
description = "Deterministic simulation testing for distributed systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ibrahim Adlani" }]
keywords = [
    "distributed-systems",
    "deterministic-simulation",
    "testing",
    "linearizability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["click>=8.1", "rich>=13.7"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98",
    "jsonschema>=4.21",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
cassette = "cassette.cli.main:main"

[project.urls]
Homepage = "https://github.com/ibrahimadlani/cassette"
Issues = "https://github.com/ibrahimadlani/cassette/issues"

[tool.hatch.build.targets.wheel]
packages = ["cassette"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["cassette", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D105", # magic methods do not need a docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.isort]
known-first-party = ["cassette", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The determinism contract, as a lint rule. Banned everywhere by default and
# lifted below for the layers that are allowed to touch the real world.
# See docs/DETERMINISM.md and tests/test_determinism_guard.py.
"asyncio".msg = "the simulation core is single-threaded on purpose"
"datetime".msg = "use env.now()"
"multiprocessing".msg = "the simulation core is single-threaded on purpose"
"os".msg = "no I/O in the core; it arrives through Env"
"pathlib".msg = "no I/O in the core; it arrives through Env"
"random".msg = "use env.random(), which draws from the seeded source"
"secrets".msg = "nothing in a simulation may be unpredictable"
"socket".msg = "there is no real network here"
"subprocess".msg = "no I/O in the core; it arrives through Env"
"threading".msg = "the simulation core is single-threaded on purpose"
"time".msg = "use env.now()"
"uuid".msg = "identifiers are counters so that they replay"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "TID251"]
"cassette/sim/rng.py" = ["TID251"]  # the one module allowed to wrap `random`
"cassette/cli/*" = ["TID251"]        # the layer whose job is touching the outside world
"cassette/fuzz.py" = ["TID251"]      # whole seeds in separate processes, never inside one
"cassette/corpus.py" = ["TID251"]    # reads and writes regressions.txt
"scripts/*" = ["TID251"]             # build tooling, not simulation

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["cassette", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["slow: takes more than a second, excluded from the fast loop"]

[tool.coverage.run]
source = ["cassette"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
