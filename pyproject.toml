[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cassette"
version = "0.1.0"
description = "Deterministic simulation testing for distributed systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ibrahim Adlani" }]
keywords = [
    "distributed-systems",
    "deterministic-simulation",
    "testing",
    "linearizability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["click>=8.1", "rich>=13.7"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98",
    "jsonschema>=4.21",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
cassette = "cassette.cli.main:main"

[project.urls]
Homepage = "https://github.com/ibrahimadlani/cassette"
Issues = "https://github.com/ibrahimadlani/cassette/issues"

[tool.hatch.build.targets.wheel]
packages = ["cassette"]
